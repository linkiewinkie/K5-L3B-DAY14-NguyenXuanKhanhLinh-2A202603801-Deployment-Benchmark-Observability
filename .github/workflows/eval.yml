name: Quality gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Evaluate agent v2
        run: |
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 python app.py > /tmp/day14-agent.log 2>&1 &
          agent_pid=$!
          trap 'kill "$agent_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8000/health >/dev/null; then
              python eval/run_eval.py --url http://127.0.0.1:8000 --min-accuracy 0.85
              exit
            fi
            kill -0 "$agent_pid" 2>/dev/null || break
            sleep 1
          done
          cat /tmp/day14-agent.log
          exit 1
