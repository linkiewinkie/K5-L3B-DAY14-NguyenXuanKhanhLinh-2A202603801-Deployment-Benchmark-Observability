services:
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
  - type: keyvalue
    name: day14-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
